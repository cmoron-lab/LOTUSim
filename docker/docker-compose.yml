version: "3.8"

services:
  backend:
    image: lotusim:latest
    working_dir: /home/lotusim_ws/src/LOTUSim-UI-backend
    command:
      - /bin/bash
      - -c
      - npx ts-node src/main.ts
    environment:
      # The API refuses any other origin. The browser loads the UI from the
      # frontend service below, so that is the origin it must allow.
      CORS_ORIGIN: http://localhost
    # 5000 is what the backend listens on; the published port has to match it
    # because the UI defaults to reaching the API on localhost:5000.
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: lotusim-frontend:latest
    # 8080 inside: the image runs nginx as a non-root user, which cannot bind 80.
    ports:
      - "80:8080"
    restart: unless-stopped

  lotusim:
    image: lotusim:latest
    command: ["lotusim", "run"]
    restart: unless-stopped
